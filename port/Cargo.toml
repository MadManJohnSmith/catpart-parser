# The Port (Phase 5, GLOSSARY): the decode pipeline of the Python
# reference src/catpart/ reproduced in Rust — one crate, two targets
# (spec docs/specs/phase5-viewer-spec.md §2.1): the rlib compiles
# native (the Fidelity harness drives it, §4), the cdylib compiles
# wasm32-unknown-unknown (what the viewer ships, §5). Dependencies
# kept minimal per §2.1/§2.3 — the decode is struct-walking, the JSON
# is output-only; nothing else runtime. The numeric-contract lint
# policy (§2.2) is documented in src/lib.rs's doc header.
[package]
name = "port"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust port of the catpart Python reference decode pipeline (Phase 5 web viewer)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"

[dev-dependencies]
wasm-bindgen-test = "0.3.80"
