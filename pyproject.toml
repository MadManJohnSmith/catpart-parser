[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "catpart-parser"
version = "0.1.0"
description = "Reader for CATIA V5 .CATPart/.CATProduct binaries, built by evidence-driven reverse engineering."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MadManJohnSmith" }]
keywords = ["CATIA", "CATPart", "CATProduct", "CAD", "reverse-engineering", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/MadManJohnSmith/catpart-parser"
Issues = "https://github.com/MadManJohnSmith/catpart-parser/issues"

[project.scripts]
catpart-inspect = "catpart.cli:main_inspect"
catpart-fitness = "catpart.cli:main_fitness"

[project.optional-dependencies]
test = ["pytest>=8.0"]
# Pinned exactly: ruff's rule set shifts between releases and lint
# results must not drift between a dev machine and CI.
lint = ["ruff==0.17.4"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Classic default subset: pyflakes (F) plus the pycodestyle error classes
# that flag real bugs (E4 imports/errors, E7 comparisons/naming, E9
# runtime). Deliberately no style rules (E5 line length, I import order,
# UP, B, ...) — the tree keeps its existing shape; see scripts/triage.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# One-off analysis scripts behind dated evidence notes: terse by design,
# not package code. Their style nits (lambda assignments, ambiguous
# names, multi-imports) stay as written.
"scripts/triage/*" = ["E401", "E731", "E741", "F541", "F841"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catpart = ["schema/*.json"]
