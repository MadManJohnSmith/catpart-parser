# ADR-0003: GitHub Actions stays light — lint and unit tests over
# script-generated synthetic fixtures only. The corpus is never present
# in CI: not committed (dispatch-recipes hard rule), not downloaded, not
# cached, not referenced by any step. Real fitness runs locally on the
# machine holding corpus/ and publishes to gh-pages.
#
# Amended 2026-11-13 (Phase 5 spec §7 — the A5 amendment ADR-0004
# requires; ticket #51): the port/ crate adds cargo build (native +
# wasm32-unknown-unknown), fmt, clippy and test — still fixture-free
# and corpus-free. From V0 the Rust toolchain is a required dev
# dependency; the pinned toolchain lives in port/rust-toolchain.toml
# (single source of truth — nothing pins the version again here).
#
# Amended 2026-11-14 (V4, ticket #43, spec §7 step 6): the port job
# gains the shipped-artifact steps — wasm-pack build --target web
# (wasm-pack pinned 0.15.1, recorded on the ticket per §2.1) and
# wasm-bindgen-test under NODE on the §7 fixture subset (canonical
# store + corrupted variants): CI *runs* the shipped artifact
# headlessly, catching wasm-linkage-only bugs the native runs cannot
# see. Playwright stays LOCAL (§7 — no browsers in Actions).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pinned ruff
        # Version lives in pyproject.toml ([lint] extra): single source
        # of truth so dev machines and CI flag the same things.
        run: python -m pip install -e '.[lint]'
      - name: Ruff
        run: ruff check .

  tests:
    name: tests (pytest, synthetic fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Pytest
        run: python -m pytest -q

  binary-guard:
    name: binary guard (no CATIA binaries staged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install package
        run: python -m pip install -e '.[test]'
      - name: Guard test (A2, #12)
        # The A2 guard scans every tracked file: rejects CATIA suffixes
        # and any file whose first 8 bytes are the V5_CFV2 magic, so a
        # forced `git add` of a corpus binary (under any name or path)
        # fails this job. Logic lives in tests/test_fixturegen.py — run,
        # not duplicated.
        run: python -m pytest -v tests/test_fixturegen.py::test_no_real_catia_binaries_staged

  port:
    name: "port (cargo: build native + wasm32, fmt, clippy, test; wasm-pack web + node tests)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo (registry, git deps, target dir)
        # Spec §7: "cargo cached". The lockfile hash keys the cache; a
        # dependency bump re-builds, everything else stays warm.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            port/target
            ~/.cache/wasm-pack
          key: cargo-${{ runner.os }}-${{ hashFiles('port/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Install pinned toolchain
        # rust-toolchain.toml (channel, components, wasm32 target) is
        # the single source of truth; bare `rustup toolchain install`
        # inside port/ installs exactly what it pins.
        working-directory: port
        run: rustup toolchain install
      - name: Pin Node for the wasm-bindgen tests
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned wasm-pack (0.15.1, sha256-verified)
        # The packaging tool, pinned per spec §2.1 and recorded on
        # ticket #43; the digest is the release tarball's sha256
        # (recorded in the ticket evidence too). No curl|sh installer.
        run: |
          curl -sSLo /tmp/wasm-pack.tar.gz \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz
          echo "410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2  /tmp/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          install /tmp/wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version
      - name: Build (native — the Fidelity-harness target)
        working-directory: port
        run: cargo build --locked
      - name: Build (wasm32-unknown-unknown — the viewer artifact)
        working-directory: port
        run: cargo build --locked --target wasm32-unknown-unknown
      - name: Format
        working-directory: port
        run: cargo fmt --check
      - name: Clippy (the numeric-contract lint policy, spec §2.2)
        working-directory: port
        run: cargo clippy --locked -- -D warnings
      - name: Test (fixture-free micro tests)
        working-directory: port
        run: cargo test --locked
      - name: wasm-pack build --target web (spec §7 step 6; the committed
          pkg/ is port/pkg/ + site/viewer/pkg/ — owner decision 2026-11-13)
        # Built to a check dir OUTSIDE the committed pkg/: CI proves the
        # packaging step succeeds without touching the reviewed
        # artifacts (wasm-pack would otherwise also write pkg/.gitignore).
        working-directory: port
        run: wasm-pack build --target web --release --out-dir target/wasm-pack-check
      - name: wasm-bindgen-test under Node (the shipped artifact RUNS —
          spec §7 step 6, the §7 fixture subset)
        working-directory: port
        run: wasm-pack test --node
